name: Deploy to AlwaysData

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and Deploy to AlwaysData
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ssh-letoan0504.alwaysdata.net
          username: letoan0504
          password: ${{ secrets.ALWAYSDATA_PASSWORD }}
          script: |
            cd ~/IntroBotDiscord || cd ~/intro-bot-discord || exit 1
            git reset --hard HEAD
            git pull origin main
            if [ -f bot.pid ]; then kill -9 $(cat bot.pid) 2>/dev/null || true; rm -f bot.pid; fi
            pkill -f "node dist/index.js" || true
            sleep 2
            nohup node dist/index.js > bot.log 2>&1 & echo $! > bot.pid
            echo "[ALWAYS DATA DEPLOY SUCCESS] BotToan code pulled and restarted successfully!"
