name: Deploy to AlwaysData

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and Deploy to AlwaysData
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ssh-letoan0504.alwaysdata.net
          username: letoan0504
          password: ${{ secrets.ALWAYSDATA_PASSWORD }}
          script: |
            cd ~/IntroBotDiscord || cd ~/intro-bot-discord || exit 1
            git reset --hard HEAD
            git pull origin main
            npm install --no-audit --no-fund
            npx tsc
            node -e "require('ffmpeg-static')" 2>/dev/null || npm install ffmpeg-static --no-audit --no-fund
            chmod -R +x node_modules/ffmpeg-static/ 2>/dev/null || true
            pkill -9 -f "index.js" || true
            pkill -9 -f "node" || true
            sleep 2
            nohup node dist/index.js > bot.log 2>&1 &
            echo "[ALWAYS DATA DEPLOY SUCCESS] BotToan code pulled, compiled and restarted successfully!"
