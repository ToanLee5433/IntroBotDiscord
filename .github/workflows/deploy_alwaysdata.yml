name: Deploy to AlwaysData

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and Deploy to AlwaysData
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ssh-letoan0504.alwaysdata.net
          username: letoan0504
          password: ${{ secrets.ALWAYSDATA_PASSWORD }}
          request_pty: false
          script: |
            cd ~/IntroBotDiscord || cd ~/intro-bot-discord || exit 1
            git reset --hard HEAD
            git pull origin main
            npm install --omit=dev
            OLD_PID=$(cat bot.pid 2>/dev/null || echo "")
            if [ -n "$OLD_PID" ] && kill -0 "$OLD_PID" 2>/dev/null; then
              kill -9 "$OLD_PID" 2>/dev/null || true
            fi
            rm -f bot.pid
            sleep 1
            nohup node dist/index.js >> bot.log 2>&1 &
            echo $! > bot.pid
            disown
            echo "[DEPLOY OK] BotToan restarted with PID $(cat bot.pid)"

