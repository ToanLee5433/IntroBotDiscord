# Workflow này đã bị tắt vì bot hiện đang deploy trên Railway.app
# Hugging Face Docker Space yêu cầu tài khoản PRO trả phí
# Để kích hoạt lại: uncomment phần 'on:' bên dưới và thêm lại các bước cần thiết

name: Sync to Hugging Face hub

on:
  workflow_dispatch: # Chỉ chạy khi kích hoạt thủ công, không tự động

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    if: false # Tắt hoàn toàn job này
    steps:
      - name: Disabled
        run: echo "Workflow này đã bị tắt. Bot đang chạy trên Railway.app"
